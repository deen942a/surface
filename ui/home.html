<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

      body {
        background: #09090e;
        color: #fff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* GRID */
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(124, 58, 237, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(124, 58, 237, 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
        pointer-events: none;
        z-index: 0;
      }

      /* PARTICLES */
      canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      /* GLOW */
      .glow {
        position: fixed;
        width: 680px;
        height: 680px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.13) 0%, transparent 68%);
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        width: 100%;
        max-width: 660px;
        padding: 0 24px;
      }

      /* CLOCK */
      .top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .clock {
        font-size: 84px;
        font-weight: 800;
        letter-spacing: -4.5px;
        background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.65) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
      }

      .date {
        font-size: 11px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.32);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      /* SEARCH */
      .search-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.035);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 14px 16px 14px 20px;
        transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        width: 100%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .search-box:focus-within {
        border-color: #7c3aed;
        background: rgba(124, 58, 237, 0.07);
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.14),
                    0 12px 40px rgba(124, 58, 237, 0.18);
        transform: translateY(-1px);
      }

      .search-icon {
        color: rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
        transition: color 0.2s;
      }

      .search-box:focus-within .search-icon {
        color: #a78bfa;
      }

      .search-box input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: #fff;
        font-size: 14px;
        font-family: 'Inter', sans-serif;
        user-select: text;
      }

      .search-box input::placeholder {
        color: rgba(255, 255, 255, 0.25);
      }

      .search-submit {
        background: rgba(124, 58, 237, 0.2);
        border: 1px solid rgba(124, 58, 237, 0.35);
        color: #c4b5fd;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s;
      }

      .search-submit:hover {
        background: #7c3aed;
        color: #fff;
      }

      /* BANG CHIPS */
      .bang-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .bang-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        transition: all 0.15s;
      }

      .bang-chip code {
        color: #a78bfa;
        font-family: monospace;
        font-weight: 700;
      }

      .bang-chip:hover {
        background: rgba(124, 58, 237, 0.14);
        border-color: rgba(124, 58, 237, 0.35);
        color: #fff;
        transform: translateY(-1px);
      }

      /* STATS */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        width: 100%;
      }

      .stat {
        background: rgba(255, 255, 255, 0.025);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: all 0.2s;
      }

      .stat:hover {
        background: rgba(124, 58, 237, 0.07);
        border-color: rgba(124, 58, 237, 0.22);
        transform: translateY(-2px);
      }

      .stat-value {
        font-size: 22px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.5px;
      }

      .stat-value span {
        color: #a78bfa;
      }

      .stat-label {
        font-size: 10px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* PINNED SITES */
      .section-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .section-label {
        font-size: 10px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.25);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        padding-left: 4px;
      }

      .recents {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        width: 100%;
      }

      .recent {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 13px;
        background: rgba(255, 255, 255, 0.025);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 13px;
        cursor: pointer;
        transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        min-width: 0;
      }

      .recent:hover {
        background: rgba(124, 58, 237, 0.1);
        border-color: rgba(124, 58, 237, 0.3);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }

      .recent-favicon {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: rgba(124, 58, 237, 0.14);
        border: 1px solid rgba(124, 58, 237, 0.25);
        color: #c4b5fd;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .recent-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .recent-title {
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.85);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .recent-url {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.28);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .wordmark {
        position: fixed;
        bottom: 18px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: rgba(255, 255, 255, 0.1);
        text-transform: uppercase;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <canvas id="particles"></canvas>
    <div class="glow"></div>

    <div class="content">
      <div class="top">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date"></div>
      </div>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search-input" type="text" placeholder="Search the web, enter a URL, or use a !bang..." autofocus autocomplete="off" spellcheck="false" />
          <button class="search-submit" id="search-btn" title="Go">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

        <div class="bang-bar">
          <div class="bang-chip" onclick="useBang('!g ')"><code>!g</code> Google</div>
          <div class="bang-chip" onclick="useBang('!yt ')"><code>!yt</code> YouTube</div>
          <div class="bang-chip" onclick="useBang('!gh ')"><code>!gh</code> GitHub</div>
          <div class="bang-chip" onclick="useBang('!r ')"><code>!r</code> Reddit</div>
          <div class="bang-chip" onclick="useBang('!w ')"><code>!w</code> Wikipedia</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="stat-blocked"><span>0</span></div>
          <div class="stat-label">Trackers Blocked</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-tabs"><span>1</span></div>
          <div class="stat-label">Open Tabs</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-sites"><span>0</span></div>
          <div class="stat-label">Sites Visited</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-time"><span>0m</span></div>
          <div class="stat-label">Session Time</div>
        </div>
      </div>

      <div class="section-wrapper">
        <div class="section-label">Quick Launch</div>
        <div class="recents" id="recents">
          <div class="recent" onclick="go('https://youtube.com')">
            <div class="recent-favicon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.5 15.5v-7l6.3 3.5-6.3 3.5z"/>
              </svg>
            </div>
            <div class="recent-info">
              <div class="recent-title">YouTube</div>
              <div class="recent-url">youtube.com</div>
            </div>
          </div>

          <div class="recent" onclick="go('https://github.com')">
            <div class="recent-favicon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.25.8-.55v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.7 1.2 3.3.9.1-.7.4-1.2.7-1.5-2.55-.3-5.25-1.3-5.25-5.7 0-1.25.45-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 .95-.3 3.1 1.2a10.8 10.8 0 0 1 5.7 0c2.15-1.5 3.1-1.2 3.1-1.2.6 1.6.2 2.8.1 3.1.75.8 1.2 1.85 1.2 3.1 0 4.4-2.7 5.4-5.25 5.7.4.35.8 1.05.8 2.1v3.1c0 .3.2.65.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
              </svg>
            </div>
            <div class="recent-info">
              <div class="recent-title">GitHub</div>
              <div class="recent-url">github.com</div>
            </div>
          </div>

          <div class="recent" onclick="go('https://reddit.com')">
            <div class="recent-favicon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="14" r="7"/>
                <circle cx="9.5" cy="13" r="1" fill="currentColor"/>
                <circle cx="14.5" cy="13" r="1" fill="currentColor"/>
                <path d="M9.5 16.5c1.5 1 3.5 1 5 0"/>
                <path d="M12 7V3l4 1"/>
                <circle cx="17" cy="4" r="1.5"/>
              </svg>
            </div>
            <div class="recent-info">
              <div class="recent-title">Reddit</div>
              <div class="recent-url">reddit.com</div>
            </div>
          </div>

          <div class="recent" onclick="go('https://x.com')">
            <div class="recent-favicon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </div>
            <div class="recent-info">
              <div class="recent-title">X</div>
              <div class="recent-url">x.com</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="wordmark">Surface</div>

    <script>
      // CLOCK
      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = `${h}:${m}`;
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        document.getElementById('date').textContent =
          `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      }
      updateClock();
      setInterval(updateClock, 1000);

      // SESSION TIMER
      const sessionStart = Date.now();
      setInterval(() => {
        const mins = Math.floor((Date.now() - sessionStart) / 60000);
        document.getElementById('stat-time').innerHTML = `<span>${mins}m</span>`;
      }, 5000);

      // PARTICLES
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = Array.from({ length: 55 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        dx: (Math.random() - 0.5) * 0.28,
        dy: (Math.random() - 0.5) * 0.28,
        alpha: Math.random() * 0.4 + 0.1,
      }));

      function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(147, 100, 255, ${p.alpha})`;
          ctx.fill();
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
        });
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 100) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(124, 58, 237, ${0.12 * (1 - dist / 100)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(drawParticles);
      }
      drawParticles();
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      // SEARCH & BANGS
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') go(e.target.value);
      });
      document.getElementById('search-btn').addEventListener('click', () => {
        go(searchInput.value);
      });

      function useBang(prefix) {
        searchInput.value = prefix;
        searchInput.focus();
      }

      function go(url) {
        if (!url || !url.trim()) return;
        window.parent.postMessage({ type: 'navigate', url }, '*');
      }

      // SYNC STATS FROM PARENT
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'stats-update') {
          document.getElementById('stat-tabs').innerHTML = `<span>${event.data.tabsCount}</span>`;
          document.getElementById('stat-sites').innerHTML = `<span>${event.data.sitesVisited}</span>`;
          document.getElementById('stat-blocked').innerHTML = `<span>${event.data.trackersBlocked}</span>`;
        }
      });

      window.parent.postMessage({ type: 'request-stats' }, '*');
    </script>
  </body>
</html>
