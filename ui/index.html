<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surface</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- TITLEBAR -->
    <div id="titlebar" data-tauri-drag-region>
      <div class="app-brand" data-tauri-drag-region>
        <div class="brand-dot"></div>
      </div>

      <div id="tabs">
        <!-- Tabs rendered by main.js -->
      </div>

      <button id="btn-newtab" title="New Tab (Ctrl+T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>

      <!-- Drag spacer so empty titlebar area is always draggable -->
      <div class="titlebar-spacer" data-tauri-drag-region></div>

      <div id="controls">
        <button id="btn-minimize" title="Minimize">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M5 12h14"/>
          </svg>
        </button>
        <button id="btn-maximize" title="Maximize">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </button>
        <button id="btn-close" title="Close">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- NAVBAR -->
    <div id="navbar">
      <div class="nav-actions">
        <button id="nav-back" title="Back">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <button id="nav-forward" title="Forward">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
        <button id="nav-reload" title="Reload (Ctrl+R)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
        </button>
        <button id="nav-home" title="Home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </button>
      </div>

      <div class="omnibox">
        <div class="shield-pill" title="Surface Shield Active">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span id="shield-count">0</span>
        </div>

        <span id="bang-indicator" class="bang-pill hidden"></span>

        <input id="urlbar" type="text" placeholder="Search with Google, type a !bang, or enter URL..." spellcheck="false" autocomplete="off" />

        <kbd class="url-shortcut">Ctrl+L</kbd>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content">
      <iframe id="homepage" src="home.html" frameborder="0"></iframe>
    </div>

    <script src="main.js"></script>
  </body>
</html>
