[package]
name = "surface"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "surfacebrowser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri = { version = "2", features = ["unstable"] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adblock = { git = "https://github.com/brave/adblock-rust", branch = "master" }
global-hotkey = "0.5"
tokio = { version = "1", features = ["full"] }
